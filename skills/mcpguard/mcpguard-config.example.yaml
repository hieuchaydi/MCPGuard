# Copy this file outside the installed Skill and replace placeholders.
server:
  command: "python <ABSOLUTE_PATH_TO_MCP_SERVER>/server.py"

policy:
  fail_on: "high"

schema:
  require_input_schema: true
  require_descriptions: true
  require_required_fields: true
  require_max_for_numbers: true
  min_description_length: 10

timeout:
  timeout_ms: 10000
  warn_after_ms: 3000

secret:
  enabled: true
  patterns:
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
    - "token="
    - "PRIVATE KEY"

tools:
  <TOOL_NAME>:
    allow_paths:
      - "<ABSOLUTE_OR_WORKSPACE_PATH>/docs"
      - "<ABSOLUTE_OR_WORKSPACE_PATH>/src"
    deny_paths:
      - ".env"
      - "~/.ssh"
    # Accepted by 0.1.0 configuration, but not currently enforced.
    network: false

checks:
  prompt_injection:
    enabled: true
    scan_description: true
    scan_output: true
